<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Glimmer Glade</title>
    <style>
      :root {
        --glass-bg: rgba(255, 255, 255, 0.14);
        --glass-brd: rgba(255, 255, 255, 0.35);
        --glass-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; overflow: hidden; background: #0b0d12; }

      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: manipulation;
      }

      /* ---- Backgrounds (day video / night image crossfade) ---- */
      .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 1.2s ease;
      }
      #nightImg { opacity: 0; }
      body.night #dayVideo { opacity: 0; }
      body.night #nightImg { opacity: 1; }

      /* Night dimming + cozy vignette */
      #nightVeil {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 35%, rgba(10,18,45,0) 35%, rgba(6,10,30,0.55) 100%);
        opacity: 0; transition: opacity 1.2s ease;
      }
      body.night #nightVeil { opacity: 1; }

      #world { position: absolute; inset: 0; }

      /* ---- Characters ---- */
      .char {
        position: absolute;
        transform-origin: 50% 100%;
        will-change: transform, left, top;
        pointer-events: auto;
        cursor: pointer;
        filter: drop-shadow(0 10px 12px rgba(0,0,0,0.35));
        user-select: none;
      }
      .char img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }

      /* soft ground shadow under each character */
      .shadow {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 9vmin; height: 2.4vmin;
        background: radial-gradient(closest-side, rgba(0,0,0,0.4), transparent);
        pointer-events: none;
        transition: opacity .4s ease;
      }
      body.night .shadow { opacity: 0.5; }

      /* speech bubble */
      .bubble {
        position: absolute;
        transform: translate(-50%, -120%) scale(0);
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        border: 1px solid var(--glass-brd);
        color: #fff; font-weight: 700; font-size: 14px;
        padding: 6px 12px; border-radius: 999px;
        box-shadow: var(--glass-shadow);
        white-space: nowrap; pointer-events: none;
        transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
        opacity: 0;
      }
      .bubble.show { transform: translate(-50%, -135%) scale(1); opacity: 1; }

      /* glow accents (fire / lantern / dragon) — brighter at night */
      .glow {
        position: absolute; transform: translate(-50%,-50%); border-radius: 50%;
        pointer-events: none; mix-blend-mode: screen;
        background: radial-gradient(closest-side, rgba(255,180,70,0.85), rgba(255,140,40,0) 70%);
        opacity: 0.5; transition: opacity 1s ease;
        animation: flicker 2.4s ease-in-out infinite;
      }
      body.night .glow { opacity: 0.95; }
      @keyframes flicker { 0%,100%{ transform: translate(-50%,-50%) scale(1);} 50%{ transform: translate(-50%,-50%) scale(1.12);} }

      /* ---- Fireflies ---- */
      .firefly {
        position: absolute; width: 16px; height: 16px; border-radius: 50%;
        background: radial-gradient(closest-side, #fff6c9, rgba(255,225,120,0.6) 50%, rgba(255,210,90,0) 75%);
        box-shadow: 0 0 12px 4px rgba(255,224,130,0.7);
        cursor: pointer; pointer-events: auto;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
      .spark { position:absolute; width:8px;height:8px;border-radius:50%; background:#fff; pointer-events:none; }

      /* ---- Glass HUD ---- */
      .hud { position: absolute; z-index: 20; display: flex; align-items: center; gap: 10px; }
      .glass {
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
        border: 1px solid var(--glass-brd);
        box-shadow: var(--glass-shadow);
        color: #fff; border-radius: 999px;
      }
      #hudTopLeft { top: 18px; left: 18px; }
      #hudTopRight { top: 18px; right: 18px; }
      #hudTitle { top: 18px; left: 50%; transform: translateX(-50%); }

      .counter { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-weight: 700; font-size: 16px; }
      .counter .jar { font-size: 18px; }
      .title { padding: 10px 20px; font-weight: 800; letter-spacing: 2px; font-size: 14px; text-transform: uppercase; }
      .btn {
        width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
        font-size: 20px; cursor: pointer; border: 1px solid var(--glass-brd);
        transition: transform .15s ease, background .2s ease;
      }
      .btn:active { transform: scale(.9); }
      .btn:hover { background: rgba(255,255,255,0.22); }

      /* Warmth meter */
      #warmthWrap { bottom: 20px; left: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
      #warmthBar { width: 120px; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.25); overflow: hidden; }
      #warmthFill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #ffd76b, #ff8a3d); transition: width .5s ease; }
      .lbl { font-size: 12px; font-weight: 700; letter-spacing: .5px; }

      /* ---- Loading + Intro ---- */
      .overlay {
        position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px;
        background: radial-gradient(120% 100% at 50% 30%, #1a2238, #0a0d16);
        color: #fff; transition: opacity .6s ease;
      }
      .overlay h1 { font-size: clamp(32px, 7vw, 64px); font-weight: 800; letter-spacing: 1px; }
      .overlay p { opacity: .8; max-width: 30ch; line-height: 1.5; }
      .play {
        margin-top: 8px; padding: 14px 34px; font-size: 15px; font-weight: 700; letter-spacing: 1px;
        text-transform: uppercase; cursor: pointer; color: #1a1a1a; background: #ffd76b;
        border: none; border-radius: 999px; box-shadow: 0 10px 30px rgba(255,180,70,.4);
        transition: transform .15s ease;
      }
      .play:active { transform: scale(.95); }
      .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.25); border-top-color: #ffd76b; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { opacity: 0; pointer-events: none; }
      .gone { display: none; }

      /* ---- Responsive: icons-only on mobile ---- */
      @media (max-width: 640px) {
        #hudTitle { display: none; }
        .counter .label { display: none; }
        .counter { padding: 10px 14px; }
        #warmthWrap .lbl { display: none; }
        #warmthBar { width: 84px; }
        .btn { width: 44px; height: 44px; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="dayVideo" class="bg" autoplay muted loop playsinline
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_3A4FMCrm8jYjCnPYN9rbcZn81hc/hf_20260617_153416_f3c24ce5-21e3-4d27-9805-260af745c23e.png"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_3A4FMCrm8jYjCnPYN9rbcZn81hc/hf_20260617_153516_c3aa1dda-9b40-479c-96d5-aa29574e6c33.mp4"></video>
      <img id="nightImg" class="bg"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_3A4FMCrm8jYjCnPYN9rbcZn81hc/hf_20260617_170558_28def577-4e53-4a25-affb-be2f67ee9fc4.png" alt="" />
      <div id="nightVeil"></div>

      <div id="world"></div>

      <!-- HUD -->
      <div id="hudTitle" class="hud"><div class="glass title">Glimmer Glade</div></div>
      <div id="hudTopLeft" class="hud">
        <div class="glass counter"><span class="jar">✨</span><span id="count">0</span><span class="label">&nbsp;Fireflies</span></div>
      </div>
      <div id="hudTopRight" class="hud">
        <div id="soundBtn" class="glass btn" title="Sound">🔈</div>
        <div id="dayNightBtn" class="glass btn" title="Day / Night">🌙</div>
      </div>
      <div id="warmthWrap" class="hud glass">
        <span class="lbl">Warmth</span>
        <div id="warmthBar"><div id="warmthFill"></div></div>
      </div>

      <!-- Loading -->
      <div id="loading" class="overlay">
        <div class="spinner"></div>
        <p>Waking up the glade…</p>
      </div>

      <!-- Intro -->
      <div id="intro" class="overlay hidden gone">
        <h1>Glimmer Glade</h1>
        <p>Tap the glowing fireflies to collect them, and tap your friends to say hello. That's it — just relax and enjoy the village. 🌿</p>
        <button id="playBtn" class="play">Tap to Play</button>
      </div>
    </div>

    <script>
      const BASE = "https://d8j0ntlcm91z4.cloudfront.net/user_3A4FMCrm8jYjCnPYN9rbcZn81hc/";
      const SOURCES = {
        pip:     BASE + "hf_20260617_170549_e9125265-f1b1-410b-a35c-004462fd5ebe.png",
        ember:   BASE + "hf_20260617_170550_7b9094a8-a9b8-4783-a66e-dc961d3002c3.png",
        hoot:    BASE + "hf_20260617_170551_4a037511-bbc6-4a99-8dd6-5e5e3067d37c.png",
        glow:    BASE + "hf_20260617_170553_c7212707-d534-4935-b1c4-cb21decd6e9e.png",
        bramble: BASE + "hf_20260617_170555_3eed1b99-0870-434b-9958-803f6ed1c14f.png",
      };

      const world = document.getElementById("world");

      /* ---------- Background white-removal (flood fill from edges) ---------- */
      function loadImg(src) {
        return new Promise((res, rej) => {
          const im = new Image();
          im.crossOrigin = "anonymous";
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = src;
        });
      }
      function keyOut(img) {
        const w = img.naturalWidth, h = img.naturalHeight;
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        let id;
        try { id = ctx.getImageData(0, 0, w, h); }
        catch (e) { return img.src; } // CORS-tainted → use raw image
        const p = id.data;
        const vis = new Uint8Array(w * h);
        const T = 232; // white threshold
        const isBg = (i) => p[i*4] > T && p[i*4+1] > T && p[i*4+2] > T;
        const stack = [];
        const seed = (x, y) => { const i = y*w + x; if (!vis[i] && isBg(i)) { vis[i] = 1; stack.push(i); } };
        for (let x = 0; x < w; x++) { seed(x, 0); seed(x, h - 1); }
        for (let y = 0; y < h; y++) { seed(0, y); seed(w - 1, y); }
        while (stack.length) {
          const i = stack.pop(); p[i*4+3] = 0;
          const x = i % w, y = (i / w) | 0;
          if (x + 1 < w) seed(x + 1, y);
          if (x - 1 >= 0) seed(x - 1, y);
          if (y + 1 < h) seed(x, y + 1);
          if (y - 1 >= 0) seed(x, y - 1);
        }
        // defringe: soften bright pixels touching transparency
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const i = y*w + x;
            if (p[i*4+3] === 0) continue;
            if (p[(i-1)*4+3] === 0 || p[(i+1)*4+3] === 0 || p[(i-w)*4+3] === 0 || p[(i+w)*4+3] === 0) {
              const lum = (p[i*4] + p[i*4+1] + p[i*4+2]) / 3;
              if (lum > 215) p[i*4+3] = Math.max(0, 255 - (lum - 215) * 4);
            }
          }
        }
        ctx.putImageData(id, 0, 0);
        return cv.toDataURL("image/png");
      }

      /* ---------- Helpers ---------- */
      const SW = () => world.clientWidth, SH = () => world.clientHeight;
      const rand = (a, b) => a + Math.random() * (b - a);

      function makeShadow() {
        const s = document.createElement("div"); s.className = "shadow"; world.appendChild(s); return s;
      }

      /* ---------- Character class ---------- */
      class Character {
        constructor(key, src, opts) {
          this.key = key;
          this.o = opts;
          this.x = opts.x; this.y = opts.y;     // % of stage (feet anchor)
          this.face = 1;
          this.bob = Math.random() * 6.28;
          this.el = document.createElement("div");
          this.el.className = "char";
          this.el.style.width = opts.size;
          const im = document.createElement("img"); im.src = src; this.el.appendChild(im);
          this.el.addEventListener("click", () => this.onTap());
          world.appendChild(this.el);
          this.shadow = makeShadow();
          this.bubbleEl = null;
        }
        say(text) {
          if (!this.bubbleEl) { this.bubbleEl = document.createElement("div"); this.bubbleEl.className = "bubble"; world.appendChild(this.bubbleEl); }
          this.bubbleEl.textContent = text;
          this.bubbleEl.style.left = (this.x / 100 * SW()) + "px";
          this.bubbleEl.style.top = (this.y / 100 * SH() - this.el.clientHeight) + "px";
          this.bubbleEl.classList.add("show");
          clearTimeout(this._bt);
          this._bt = setTimeout(() => this.bubbleEl.classList.remove("show"), 1600);
        }
        onTap() {
          this.happy = 1; // triggers a little hop
          game.addFirefly(this.x, this.y - 6);
          this.say(this.o.cheer || "♥");
          game.sound("pluck");
        }
        place(extraScale = 1, extraY = 0, rot = 0) {
          const px = this.x / 100 * SW();
          const py = this.y / 100 * SH() + extraY;
          this.el.style.left = px + "px";
          this.el.style.top = py + "px";
          this.el.style.transform =
            `translate(-50%, -100%) rotate(${rot}deg) scaleX(${this.face}) scale(${(this.o.scale||1) * extraScale})`;
          this.shadow.style.left = px + "px";
          this.shadow.style.top = py + "px";
          this.shadow.style.width = (this.el.clientWidth * 0.6) + "px";
        }
      }

      /* ---------- Game ---------- */
      const game = {
        chars: {}, fireflies: [], count: 0, warmth: 0, audioOn: false, ac: null, last: 0,
        sound(type) {
          if (!this.audioOn) return;
          try {
            if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
            const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
            o.connect(g); g.connect(this.ac.destination);
            if (type === "pluck") { o.frequency.value = 720; g.gain.setValueAtTime(.18, t); o.frequency.exponentialRampToValueAtTime(1100, t + .12); }
            else { o.frequency.value = 320; g.gain.setValueAtTime(.12, t); }
            g.gain.exponentialRampToValueAtTime(.0001, t + .3);
            o.start(t); o.stop(t + .32);
          } catch (e) {}
        },
        addFirefly(xp, yp) {
          const f = document.createElement("div"); f.className = "firefly";
          const fx = xp == null ? rand(8, 92) : xp + rand(-3, 3);
          const fy = yp == null ? rand(18, 70) : yp + rand(-3, 3);
          const o = { el: f, x: fx, y: fy, t: Math.random() * 6.28, sp: rand(.3, .8), amp: rand(2, 5) };
          f.addEventListener("click", (e) => { e.stopPropagation(); this.collect(o); });
          world.appendChild(f); this.fireflies.push(o); this.posFirefly(o);
        },
        posFirefly(o) {
          o.el.style.left = (o.x / 100 * SW()) + "px";
          o.el.style.top = (o.y / 100 * SH()) + "px";
        },
        collect(o) {
          const i = this.fireflies.indexOf(o); if (i < 0) return;
          this.fireflies.splice(i, 1);
          const r = o.el.getBoundingClientRect();
          o.el.remove();
          this.count++; document.getElementById("count").textContent = this.count;
          this.warmth = Math.min(100, this.warmth + 4);
          document.getElementById("warmthFill").style.width = this.warmth + "%";
          document.documentElement.style.setProperty("--warm", this.warmth);
          this.sound("pluck");
          // sparkle burst
          for (let k = 0; k < 6; k++) {
            const s = document.createElement("div"); s.className = "spark";
            s.style.left = r.left + "px"; s.style.top = r.top + "px";
            document.body.appendChild(s);
            const ang = Math.random() * 6.28, d = 20 + Math.random() * 30;
            s.animate([{ transform: "translate(0,0)", opacity: 1 }, { transform: `translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`, opacity: 0 }], { duration: 500, easing: "ease-out" }).onfinish = () => s.remove();
          }
          setTimeout(() => this.addFirefly(), rand(600, 1600));
        },
        toggleNight() {
          document.body.classList.toggle("night");
          const on = document.body.classList.contains("night");
          document.getElementById("dayNightBtn").textContent = on ? "☀️" : "🌙";
        },
      };
      window.game = game;

      /* ---------- Boot ---------- */
      async function boot() {
        // Key out backgrounds for all characters
        const keyed = {};
        await Promise.all(Object.entries(SOURCES).map(async ([k, src]) => {
          try { const im = await loadImg(src); keyed[k] = keyOut(im); }
          catch (e) { keyed[k] = src; }
        }));

        // Create characters with positions (% of stage) and behaviours
        game.chars.bramble = new Character("bramble", keyed.bramble, { x: 63, y: 60, size: "clamp(90px,15vw,180px)", scale: 1, cheer: "Welcome!" });
        game.chars.pip     = new Character("pip",     keyed.pip,     { x: 18, y: 78, size: "clamp(80px,13vw,160px)", scale: 1, cheer: "Hi!" });
        game.chars.ember   = new Character("ember",   keyed.ember,   { x: 30, y: 90, size: "clamp(64px,10vw,120px)", scale: 1, cheer: "Yip!" });
        game.chars.glow    = new Character("glow",    keyed.glow,    { x: 72, y: 30, size: "clamp(64px,10vw,120px)", scale: 1, cheer: "Rawr!" });
        game.chars.hoot    = new Character("hoot",    keyed.hoot,    { x: 85, y: 34, size: "clamp(60px,9vw,110px)",  scale: 1, cheer: "Hoo!" });

        // glows: fire + lantern + dragon
        const fireGlow = document.createElement("div"); fireGlow.className = "glow"; world.appendChild(fireGlow);
        const lampGlow = document.createElement("div"); lampGlow.className = "glow"; world.appendChild(lampGlow);
        game._glows = { fireGlow, lampGlow };

        for (let i = 0; i < 9; i++) game.addFirefly();

        document.getElementById("loading").classList.add("hidden");
        setTimeout(() => { const l = document.getElementById("loading"); l.classList.add("gone"); }, 600);
        const intro = document.getElementById("intro");
        intro.classList.remove("gone"); requestAnimationFrame(() => intro.classList.remove("hidden"));

        requestAnimationFrame(loop);
      }

      /* ---------- Pip's chore state machine ---------- */
      const pipPlan = [
        { x: 18, y: 78, wait: 800 },   // woodpile
        { x: 32, y: 80, wait: 1200, action: "fire" }, // to the fire, drop wood
        { x: 52, y: 62, wait: 400 },   // to the door
        { x: 52, y: 62, wait: 2200, action: "enter" }, // go inside
        { x: 18, y: 78, wait: 600 },   // come back out to woodpile
      ];
      let pipStep = 0, pipPhase = "walk", pipTimer = 0;
      const SPEED = 6; // % per second

      function updatePip(c, dt) {
        const target = pipPlan[pipStep];
        if (pipPhase === "walk") {
          const dx = target.x - c.x, dy = target.y - c.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.6) { pipPhase = "wait"; pipTimer = target.wait; if (target.action === "fire") flareFire(); }
          else {
            c.face = dx >= 0 ? 1 : -1;
            const step = SPEED * dt;
            c.x += dx / dist * step; c.y += dy / dist * step;
          }
          c.bob += dt * 10;
          c.place(1, Math.sin(c.bob) * 3);
        } else {
          pipTimer -= dt * 1000;
          // "enter house": fade out then back in
          if (target.action === "enter") {
            const half = target.wait / 2;
            c.el.style.opacity = pipTimer > half ? (pipTimer - half) / half : (1 - pipTimer / half);
            c.shadow.style.opacity = c.el.style.opacity;
          }
          c.place(1, 0);
          if (pipTimer <= 0) {
            c.el.style.opacity = 1; c.shadow.style.opacity = "";
            pipStep = (pipStep + 1) % pipPlan.length; pipPhase = "walk";
          }
        }
      }
      function flareFire() {
        const g = game._glows.fireGlow;
        g.animate([{ opacity: getComputedStyle(g).opacity }, { opacity: 1 }, { opacity: document.body.classList.contains("night") ? .95 : .5 }], { duration: 700 });
        game.chars.pip && game.chars.pip.say("🔥");
      }

      /* ---------- Ember roams ---------- */
      let foxDir = 1, foxWait = 0;
      function updateFox(c, dt) {
        if (foxWait > 0) { foxWait -= dt * 1000; c.place(1, 0); return; }
        c.x += foxDir * 4 * dt; c.face = foxDir;
        if (c.x > 46) { foxDir = -1; foxWait = rand(700, 1600); }
        if (c.x < 16) { foxDir = 1; foxWait = rand(700, 1600); }
        c.bob += dt * 12; c.place(1, Math.sin(c.bob) * 2);
      }

      /* ---------- main loop ---------- */
      let hootT = 0;
      function loop(ts) {
        const dt = Math.min(0.05, (ts - (game.last || ts)) / 1000); game.last = ts;
        const { pip, ember, glow, hoot, bramble } = game.chars;

        updatePip(pip, dt);
        updateFox(ember, dt);

        // dragon hovers
        glow.bob += dt * 3;
        glow.place(1 + Math.sin(glow.bob*2)*0.02, Math.sin(glow.bob) * 10);

        // owl idle + periodic hoot
        hoot.bob += dt * 4;
        let hScale = 1; hootT += dt;
        if (hootT > 5) { hootT = 0; hoot.say("Hoo!"); game.sound("hoot"); }
        hoot.place(1, Math.sin(hoot.bob) * 2);

        // elder waves (gentle rocking)
        bramble.bob += dt * 2.2;
        bramble.place(1, 0, Math.sin(bramble.bob) * 3);

        // position glows near fire & elder lantern
        const fg = game._glows.fireGlow, lg = game._glows.lampGlow;
        fg.style.left = (32/100*SW()) + "px"; fg.style.top = (80/100*SH()) + "px"; fg.style.width = fg.style.height = "16vmin";
        lg.style.left = (60/100*SW()) + "px"; lg.style.top = (60/100*SH()) + "px"; lg.style.width = lg.style.height = "7vmin";

        // drift fireflies
        for (const o of game.fireflies) {
          o.t += dt * o.sp;
          o.el.style.transform = `translate(${Math.sin(o.t)*o.amp*4}px, ${Math.cos(o.t*0.8)*o.amp*4}px)`;
        }

        requestAnimationFrame(loop);
      }

      // Note: elder transform is overwritten by place(); apply wave via place override
      // (kept simple: elder simply bobs)

      /* ---------- UI wiring ---------- */
      document.getElementById("dayNightBtn").addEventListener("click", () => game.toggleNight());
      document.getElementById("soundBtn").addEventListener("click", (e) => {
        game.audioOn = !game.audioOn;
        e.target.textContent = game.audioOn ? "🔊" : "🔈";
        if (game.audioOn && !game.ac) { try { game.ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} }
      });
      document.getElementById("playBtn").addEventListener("click", () => {
        const intro = document.getElementById("intro");
        intro.classList.add("hidden"); setTimeout(() => intro.classList.add("gone"), 600);
        game.audioOn = true; document.getElementById("soundBtn").textContent = "🔊";
        try { game.ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){}
        document.getElementById("dayVideo").play().catch(()=>{});
      });

      boot();
    </script>
  </body>
</html>
