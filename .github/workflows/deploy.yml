name: Deploy to GitHub Pages

# Publishes the built site to the `gh-pages` branch (Pages source:
# "Deploy from a branch" -> gh-pages / root). This avoids the branch-restricted
# `github-pages` deployment environment.

on:
  push:
    branches:
      - claude/brave-carson-kl4wal
      - claude/great-ramanujan-6gq2v7
      - claude/ace-breaker-game-analysis-5rs95l
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
